<!DOCTYPE html>
<html lang="en" data-gif-theme="storm">
<head>
    <meta charset="UTF-8">
    <script>var gi=localStorage.getItem('gifIndex');if(gi!==null){var ti=parseInt(gi,10);if(!isNaN(ti)&&ti>=0&&ti<=7)document.documentElement.setAttribute('data-gif-theme',['ursa','brew','fura','storm','invoker','meepo','bh','axe'][ti]);}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gradient Text — create beautiful animated gradient text">
    <meta name="author" content="lepex">
    <base href="/portfolio/gradient-text/">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" as="style">
    <link rel="preload" href="/fonts/satoshi.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;700;900&display=swap" as="style">

    <title data-lang-ru="Градиентный текст" data-lang-en="Gradient Text">Gradient Text</title>
    <link rel="stylesheet" href="/fonts/satoshi.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/shared.css">
    <link rel="stylesheet" href="css/gradient.css">
</head>
<body>

    <header class="md3-top-app-bar">
        <div class="md3-top-bar-container">
            <div class="md3-top-bar-left">
                <a href="/portfolio/" class="md3-back-link" aria-label="Home" title="Home">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div class="md3-brand">
                    <span class="material-symbols-outlined brand-icon">auto_awesome</span>
                    <span class="brand-name">gradient text</span>
                    <img src="/assets/previews/gif-themes/storm.gif" class="gif-switcher" id="clickable-gif">
                </div>
            </div>
            <div class="md3-app-bar-actions">
                <button class="md3-pill-button" id="lang-toggle" aria-label="Toggle language">
                    <span class="material-symbols-outlined btn-icon-leading">translate</span>
                    <span class="lang-text">EN</span>
                </button>
            </div>
        </div>
    </header>

    <div class="page-content">
        <main class="md3-main-content">
            <div class="gradient-editor-card reveal-card" id="editor">
                <div class="card-icon-wrapper">
                    <span class="material-symbols-outlined card-main-icon">auto_awesome</span>
                </div>
                <h2 class="card-title" data-lang-ru="Редактор" data-lang-en="Editor">Editor</h2>

                <label class="gradient-field-label" data-lang-ru="Текст" data-lang-en="Text">Text</label>
                <textarea id="textInput" class="gradient-textarea" rows="3" data-placeholder-ru="Введите текст..." data-placeholder-en="Type something..." placeholder="Type something...">Hello World!</textarea>

                <label class="gradient-field-label" id="fontSizeLabel">Font Size: <span id="fontSizeValue">80</span>px</label>
                <input id="fontSize" type="range" class="gradient-range" min="20" max="200" value="80" />

                <label class="gradient-field-label" data-lang-ru="Градиент" data-lang-en="Gradient">Gradient</label>
                <div class="gradient-presets" id="gradientList"></div>
                <p class="gradient-name" id="gradientName">rainbow</p>

                <button id="showButton" class="md3-filled-button" style="width:100%;justify-content:center;">
                    <span class="material-symbols-outlined">visibility</span>
                    <span data-lang-ru="Показать градиент" data-lang-en="Show Gradient Text">Show Gradient Text</span>
                </button>
            </div>

            <div class="gradient-display-card hidden" id="display">
                <button id="backButton" class="md3-pill-button" style="align-self:flex-start;">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span data-lang-ru="Назад в редактор" data-lang-en="Back to Editor">Back to Editor</span>
                </button>
                <div class="gradient-output">
                    <h1 id="outputText"></h1>
                </div>
            </div>
        </main>

        <footer class="md3-footer">
            <p class="footer-text">lepex &copy; <span id="year"></span></p>
            <p class="footer-credit" data-lang-ru="Дизайн вдохновлён <a href='https://github.com/h6rd/Dota2PornFxWeb' target='_blank' rel='noopener'>Dota2PornFxWeb</a> от hrdq. Цветовые схемы, гифки и хедер позаимствованы оттуда же." data-lang-en="Design inspired by <a href='https://github.com/h6rd/Dota2PornFxWeb' target='_blank' rel='noopener'>Dota2PornFxWeb</a> by hrdq. Color schemes, GIFs and header borrowed from there.">Дизайн вдохновлён <a href="https://github.com/h6rd/Dota2PornFxWeb" target="_blank" rel="noopener">Dota2PornFxWeb</a> от hrdq. Цветовые схемы, гифки и хедер позаимствованы оттуда же.</p>
        </footer>
    </div>

    <script src="/js/core.js"></script>
    <script src="js/gradient.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeLanguage();
            initializeGifTheme();
            initializeScrollAndLayout();
            initGradient();
        });
    </script>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

</body>
</html>

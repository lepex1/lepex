<!DOCTYPE html>
<html lang="en" data-gif-theme="storm">
<head>
    <meta charset="UTF-8">
    <script>var gi=localStorage.getItem('gifIndex');if(gi!==null){var ti=parseInt(gi,10);if(!isNaN(ti)&&ti>=0&&ti<=7)document.documentElement.setAttribute('data-gif-theme',['ursa','brew','fura','storm','invoker','meepo','bh','axe'][ti]);}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="lepex portfolio">
    <meta name="author" content="lepex">
    <base href="/portfolio/">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" as="style">
    <link rel="preload" href="/fonts/satoshi.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;700;900&display=swap" as="style">
    <title>Portfolio — lepex</title>
    <link rel="stylesheet" href="/fonts/satoshi.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        .md3-main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
        }
        .hub-header {
            margin-bottom: 2.5rem;
        }
        .hub-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: var(--md-sys-color-on-background);
        }
        .hub-header p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 1.05rem;
            margin-top: 0.5rem;
        }
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .hub-card {
            background: var(--md-sys-color-surface-container);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-extra-large);
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all var(--md-transition-duration) var(--md-transition-bounce);
            position: relative;
            overflow: hidden;
        }
        .hub-card:hover {
            background: var(--md-sys-color-surface-container-high);
            border-color: var(--md-sys-color-primary);
            transform: translateY(-4px);
            box-shadow: 0 16px 32px var(--md-sys-color-shadow);
        }
        .hub-card-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--md-shape-corner-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .hub-card-icon .material-symbols-outlined {
            font-size: 1.75rem;
            font-variation-settings: 'FILL' 1;
            color: rgba(0,0,0,0.7);
        }
        .hub-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .hub-card-desc {
            font-size: 0.9rem;
            color: var(--md-sys-color-on-surface-variant);
            line-height: 1.5;
        }
        .hub-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: auto;
        }
        .hub-card-tag {
            background: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            padding: 0.2rem 0.6rem;
            border-radius: var(--md-shape-corner-full);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--md-sys-color-on-surface-variant);
        }
        .hub-card-arrow {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            color: var(--md-sys-color-on-surface-variant);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .hub-card:hover .hub-card-arrow {
            opacity: 1;
            transform: translate(-2px, -2px);
        }
        @media (max-width: 768px) {
            .md3-main-content { padding: 1rem; }
            .hub-header h1 { font-size: 1.8rem; }
            .hub-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="md3-top-app-bar">
        <div class="md3-top-bar-container">
            <div class="md3-top-bar-left">
                <a href="/" class="md3-back-link" aria-label="Home" title="Home">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div class="md3-brand">
                    <span class="material-symbols-outlined brand-icon">folder</span>
                    <span class="brand-name">lepex</span>
                    <img src="/assets/previews/gif-themes/storm.gif" class="gif-switcher" id="clickable-gif">
                </div>
            </div>
            <div class="md3-app-bar-actions">
                <button class="md3-pill-button" id="lang-toggle" aria-label="Toggle language">
                    <span class="material-symbols-outlined btn-icon-leading">translate</span>
                    <span class="lang-text">EN</span>
                </button>
            </div>
        </div>
    </header>

    <div class="page-content loading">
        <main class="md3-main-content">
            <div class="hub-header reveal-card">
                <h1 data-lang-ru="Мои проекты" data-lang-en="My Projects">My Projects</h1>
                <p data-lang-ru="Все мои работы в одном месте" data-lang-en="All my work in one place">All my work in one place</p>
            </div>
            <div class="hub-grid" id="hub-container"></div>
        </main>

        <footer class="md3-footer">
            <p class="footer-text">lepex &copy; <span id="year"></span></p>
        </footer>
    </div>

    <script>var pc = document.querySelector('.page-content'); if (pc) { pc.classList.remove('loading'); pc.classList.add('loaded'); }</script>
    <script src="/js/core.js"></script>
    <script>
        document.addEventListener('click', function(e) {
            if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            var a = e.target.closest('a');
            if (!a) return;
            var href = a.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('mailto:') || a.target === '_blank' || a.hasAttribute('download')) return;
            var url = new URL(href, location.href);
            if (url.origin !== location.origin) return;
            if (url.pathname === location.pathname && url.search === location.search) return;
            e.preventDefault();
            var pc = document.querySelector('.page-content'); if (pc) pc.classList.add('page-exit');
            setTimeout(function() { location.href = a.href; }, 150);
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeLanguage();
            initializeGifTheme();
            initializeScrollAndLayout();
            loadHub();
        });
        document.getElementById('year').textContent = new Date().getFullYear();

        async function loadHub() {
            const container = document.getElementById('hub-container');
            try {
                const res = await fetch('/portfolio/data/projects.json');
                const projects = await res.json();
                container.innerHTML = projects.map(p => {
                    const title = currentLanguage === 'ru' ? p.titleRu : p.title;
                    const desc = currentLanguage === 'ru' ? p.descRu : p.desc;
                    return `
                        <a href="${p.link}" class="hub-card reveal-card">
                            <div class="hub-card-icon" style="background:${p.color}">
                                <span class="material-symbols-outlined">${p.icon}</span>
                            </div>
                            <div class="hub-card-title">${title}</div>
                            <div class="hub-card-desc">${desc}</div>
                            <span class="material-symbols-outlined hub-card-arrow">arrow_outward</span>
                        </a>
                    `;
                }).join('');
                const observer = new IntersectionObserver(e => e.forEach(en => { if(en.isIntersecting){ en.target.classList.add('in-view'); } }), {threshold:0.05});
                container.querySelectorAll('.reveal-card').forEach(c => observer.observe(c));
            } catch(e) {
                container.innerHTML = '<p style="color:var(--md-sys-color-error)">Failed to load projects</p>';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>

<body>
    <header class="md3-top-app-bar">
        <div class="md3-top-bar-container">
            <div class="md3-top-bar-left">
                <div class="md3-back-link-placeholder"></div>
                <div class="md3-brand">

                    <span class="brand-name">lepex</span>
                    <img src="/assets/previews/gif-themes/storm.gif" class="gif-switcher" id="clickable-gif">
                </div>
            </div>
            <div class="md3-app-bar-actions">
                <button class="md3-pill-button" id="lang-toggle" aria-label="Toggle language">
                    <span class="material-symbols-outlined btn-icon-leading">translate</span>
                    <span class="lang-text">EN</span>
                </button>
            </div>
        </div>
    </header>

    <main class="md3-main-content">
            <div class="md3-bento-grid">

                <!-- Discord Profile -->
                <div class="md3-bento-card md3-bento-card--full reveal-card" id="discordCard">
                    <div class="md3-discord">
                        <div class="md3-discord__header">
                            <div class="md3-discord__avatar">
                                <img src="images/avatar-placeholder.svg" alt="discord avatar" id="discordAvatar" onerror="this.src='images/avatar-placeholder.svg'">

                            </div>
                            <div class="md3-discord__info">
                                <span class="md3-discord__username" id="discordUsername">lepex</span>
                                <div class="md3-discord__location">
                                    <span class="material-symbols-outlined">location_on</span>
                                    <span data-lang-ru="Россия" data-lang-en="Russia">Russia</span>
                                </div>
                            </div>
                        </div>
                        <div class="md3-discord__activity" id="discordActivity">
                            <div class="md3-discord__activity-skeleton" data-lang-ru="Загрузка..." data-lang-en="Loading...">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Links -->
                <div class="md3-layout-grid">
                    <a href="/portfolio" rel="noopener noreferrer" class="md3-grid-link">
                        <span class="material-symbols-outlined">folder</span>
                        <span data-lang-ru="Портфолио" data-lang-en="Portfolio">Portfolio</span>
                    </a>
                    <a href="/gradient-text" class="md3-grid-link">
                        <span class="material-symbols-outlined">auto_awesome</span>
                        <span data-lang-ru="Градиентный текст" data-lang-en="Gradient Text">Gradient Text</span>
                    </a>
                    <a href="/subtitles" rel="noopener noreferrer" class="md3-grid-link">
                        <span class="material-symbols-outlined">subtitles</span>
                        <span data-lang-ru="Субтитры" data-lang-en="Subtitles">Subtitles</span>
                    </a>
                    <a href="/cassie" rel="noopener noreferrer" class="md3-grid-link">
                        <span class="material-symbols-outlined">smart_toy</span>
                        <span data-lang-ru="Cassie" data-lang-en="Cassie">Cassie</span>
                    </a>
                    <a href="http://steamcommunity.com/profiles/76561199493579774" target="_blank" rel="noopener noreferrer" class="md3-grid-link">
                        <span class="material-symbols-outlined">sports_esports</span>
                        <span>Steam</span>
                    </a>
                    <a href="https://github.com/lepex1" target="_blank" rel="noopener noreferrer" class="md3-grid-link">
                        <span class="material-symbols-outlined">code</span>
                        <span>GitHub</span>
                    </a>
                </div>

            </div>
        </main>

        <footer class="md3-footer">
            <p class="footer-text">lepex &copy; <span id="year"></span></p>
            <p class="footer-credit" data-lang-ru="Дизайн вдохновлён <a href='https://github.com/h6rd/Dota2PornFxWeb' target='_blank' rel='noopener'>Dota2PornFxWeb</a> от hrdq. Цветовые схемы, гифки и хедер позаимствованы оттуда же." data-lang-en="Design inspired by <a href='https://github.com/h6rd/Dota2PornFxWeb' target='_blank' rel='noopener'>Dota2PornFxWeb</a> by hrdq. Color schemes, GIFs and header borrowed from there.">Дизайн вдохновлён <a href="https://github.com/h6rd/Dota2PornFxWeb" target="_blank" rel="noopener">Dota2PornFxWeb</a> от hrdq. Цветовые схемы, гифки и хедер позаимствованы оттуда же.</p>
        </footer>

    <script src="js/core.js"></script>
    <script src="js/discord.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeLanguage();
            initializeGifTheme();
            initializeDiscord();
            initializeScrollAndLayout();

<!DOCTYPE html>
<html lang="en" data-gif-theme="storm">
<head>
    <meta charset="UTF-8">
    <script src="/js/preload.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Offline - lepex</title>
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="alternate" type="application/rss+xml" title="lepex RSS Feed" href="/rss.xml">
    <link rel="stylesheet" href="/fonts/satoshi.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/themes-light.css">
    <link rel="stylesheet" href="/css/shared.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 1.5rem;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 6rem;
            color: var(--md-sys-color-primary);
        }
        .offline-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            color: var(--md-sys-color-on-surface);
        }
        .offline-text {
            font-size: 1rem;
            margin: 0;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <!-- Inline SVG instead of Material Symbols ligature: the icon font lives on
             Google Fonts and is unavailable exactly when this page is shown -->
        <svg class="offline-icon" viewBox="0 0 24 24" width="96" height="96" fill="currentColor" aria-hidden="true">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.56 2.62l1.45 1.45C23.16 18.16 24 16.68 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14c0 3.31 2.69 6 6 6h11.73l2 2L21 20.73 4.27 4 3 5.27z"/>
        </svg>
        <h1 class="offline-title i18n-container">
            <span class="lang-ru">Нет подключения</span>
            <span class="lang-en">You're offline</span>
        </h1>
        <p class="offline-text i18n-container">
            <span class="lang-ru">Проверьте подключение к интернету и попробуйте снова.</span>
            <span class="lang-en">Check your internet connection and try again.</span>
        </p>
    </div>
</body>
</html>
